<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Claws x Kity | Acrílico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Permanent+Marker&family=Titan+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--pink:#e0338f;--pink-d:#c4287a;--pink-l:#ff8cc6;--soft:#ffd3ea;
  box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:#fff;font-family:Poppins,system-ui,sans-serif;overflow-x:hidden;text-align:center}
.wrap{max-width:520px;margin:0 auto;position:relative;overflow:hidden;padding-bottom:30px}
.mk{font-family:'Permanent Marker',cursive}
svg.d{position:absolute;pointer-events:none;color:var(--pink);fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:var(--pink);stroke:none}

/* ===== TÍTULO ===== */
.hd{position:relative;padding:34px 16px 4px}
h1{font-family:'Titan One',sans-serif;font-weight:400;margin:0;font-size:clamp(48px,16vw,84px);line-height:1;color:var(--pink);-webkit-text-stroke:5px #fff;paint-order:stroke fill;text-shadow:0 0 26px #e0338f88;text-transform:uppercase;position:relative;z-index:2}
.drops{display:flex;justify-content:space-around;width:78%;margin:-6px auto 0;position:relative;z-index:1}
.drops svg{width:12px;height:22px;fill:var(--pink);stroke:#fff;stroke-width:2.5}
.drops svg:nth-child(2n){height:14px}
.promo{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 0;position:relative;z-index:2}
.promo span{font-size:clamp(22px,7vw,32px);color:var(--pink-l);text-transform:uppercase}
.promo svg{width:34px;height:30px;fill:none;stroke:var(--pink);stroke-width:4;stroke-linecap:round}

/* ===== FOTO / HELLO KITTY ===== */
.stage{position:relative;height:330px;margin-top:6px}
.frame{position:absolute;left:50%;top:18px;width:230px;height:230px;margin-left:-110px;transform:rotate(-5deg);border:6px solid var(--pink);background:radial-gradient(circle at 50% 40%,#3a0a24,#0a0006 75%);box-shadow:0 0 22px #e0338f88;overflow:hidden;z-index:2}
.frame>svg{width:100%;height:100%;filter:drop-shadow(0 0 6px #e0338f)}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tape{position:absolute;left:50%;top:6px;margin-left:-118px;width:84px;height:26px;transform:rotate(-12deg);z-index:3;background:repeating-linear-gradient(135deg,#ff8cc6 0 8px,#e0338f 8px 16px);display:flex;align-items:center;justify-content:center}
.tape svg{width:16px;height:16px;fill:#000;stroke:none}

/* ===== PRECIOS ===== */
.card{margin:0 16px;border:3px solid var(--pink);border-radius:30px;padding:6px 18px;background:#0a0a0a;box-shadow:0 0 18px #e0338f55;position:relative;z-index:2}
.row{display:flex;align-items:center;gap:14px;padding:22px 0;text-align:left}
.row svg.ic{width:58px;height:66px;flex:none;fill:none;stroke:var(--pink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.row h3{flex:1;margin:0;font-size:clamp(16px,5vw,21px);font-weight:700;text-transform:uppercase}
.price{font-size:clamp(24px,8vw,34px);font-weight:700;color:var(--soft);white-space:nowrap}
.sep{display:flex;align-items:center;gap:6px}
.sep::before,.sep::after{content:"";height:2px;flex:1;background:var(--pink)}
.sep svg{width:20px;height:20px;color:var(--pink);fill:currentColor}

/* ===== PIE ===== */
.end{margin-top:26px;position:relative}
.end .ln{display:flex;align-items:center;gap:12px;padding:0 24px;margin-top:2px}
.end .ln::before,.end .ln::after{content:"";height:2px;flex:1;background:var(--pink)}
.end svg.bw{width:56px;height:44px;fill:none;stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;margin:26px auto 0;max-width:300px;padding:14px 18px;border-radius:40px;background:linear-gradient(180deg,#e84aa0,var(--pink-d));color:#fff;text-decoration:none;font-weight:600;box-shadow:0 0 0 3px #000,0 0 0 4px #e0338f88,0 0 24px #e0338f77}
.btn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body data-msg="Hola! Quiero agendar uñas acrílicas 💅">

<svg width="0" height="0" style="position:absolute">
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12C7 11 11 7 12 0z"/></symbol>
  <symbol id="nail" viewBox="0 0 58 66"><path d="M18 62C8 46 8 24 16 10c3-6 12-6 14 2 4 16 6 32 4 46-3 4-12 6-16 4z"/><path d="M22 20c0-4 4-7 8-6"/><path d="M26 42c-6-4-7-7-5-10 2-2 5-1 5 2 0-3 3-4 5-2 2 3 0 6-5 10z"/></symbol>
  <symbol id="bow" viewBox="0 0 70 50"><path d="M35 25C24 8 6 10 6 22s16 18 29 3zm0 0c11-17 29-15 29-3S48 40 35 25z"/><circle cx="35" cy="25" r="4"/></symbol>
  <symbol id="heart" viewBox="0 0 70 90"><path d="M35 22C28 4 4 8 6 28c2 16 22 24 29 30 7-6 27-14 29-30 2-20-22-24-29-6z"/><path d="M20 42v26M34 52v28M48 44v18"/></symbol>
</svg>

<script src="sitio.js"></script>

<div class="wrap">

<!-- ================= TÍTULO ================= -->
<section class="hd">
  <svg class="d f" style="left:36px;top:60px;width:34px;height:34px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <svg class="d f" style="left:20px;top:112px;width:20px;height:20px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <svg class="d f" style="right:22px;top:66px;width:26px;height:26px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <h1>Acrílico</h1>
  <div class="drops">
    <svg viewBox="0 0 12 22"><path d="M6 1C6 7 1 10 1 15a5 5 0 0 0 10 0C11 10 6 7 6 1z"/></svg>
    <svg viewBox="0 0 12 22"><path d="M6 1C6 7 1 10 1 15a5 5 0 0 0 10 0C11 10 6 7 6 1z"/></svg>
    <svg viewBox="0 0 12 22"><path d="M6 1C6 7 1 10 1 15a5 5 0 0 0 10 0C11 10 6 7 6 1z"/></svg>
    <svg viewBox="0 0 12 22"><path d="M6 1C6 7 1 10 1 15a5 5 0 0 0 10 0C11 10 6 7 6 1z"/></svg>
    <svg viewBox="0 0 12 22"><path d="M6 1C6 7 1 10 1 15a5 5 0 0 0 10 0C11 10 6 7 6 1z"/></svg>
  </div>
  <div class="promo">
    <svg viewBox="0 0 34 30"><path d="M30 6L6 10M28 18L8 20M20 28L10 28"/></svg>
    <span class="mk">Precio promocional</span>
    <svg viewBox="0 0 34 30" style="transform:scaleX(-1)"><path d="M30 6L6 10M28 18L8 20M20 28L10 28"/></svg>
  </div>
</section>

<!-- ================= CENTRO: DIBUJO DE KITTY GÓTICO =================
     Si prefieres una foto, guarda una imagen como acrilico.png en la carpeta
     y se pone sobre el dibujo automáticamente. -->
<section class="stage">
  <svg class="d" style="left:16px;top:170px;width:74px" viewBox="0 0 70 50"><use href="#bow"/></svg>
  <svg class="d" style="right:14px;top:10px;width:92px" viewBox="0 0 70 90"><use href="#heart"/></svg>
  <svg class="d f" style="left:72px;top:100px;width:26px;height:26px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <svg class="d f" style="right:70px;top:270px;width:22px;height:22px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <svg class="d" style="right:34px;top:290px;width:26px" viewBox="0 0 24 22"><path d="M12 20C2 12 1 6 5 4c3-1 6 1 7 4 1-3 4-5 7-4 4 2 3 8-7 16z"/></svg>

  <div class="tape"><svg viewBox="0 0 24 22"><path d="M12 20C2 12 1 6 5 4c3-1 6 1 7 4 1-3 4-5 7-4 4 2 3 8-7 16z"/></svg></div>
  <div class="frame">
    <svg viewBox="0 0 160 160" fill="none" stroke="#ff8cc6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- estrellitas de fondo -->
      <g fill="#e0338f" stroke="none"><use href="#spark" x="16" y="16" width="14" height="14"/><use href="#spark" x="132" y="124" width="12" height="12"/><use href="#spark" x="20" y="126" width="10" height="10"/></g>
      <!-- orejas -->
      <path d="M32 74L26 34Q46 30 62 50" fill="#0a0006"/>
      <path d="M128 74L134 34Q114 30 98 50" fill="#0a0006"/>
      <!-- cabeza -->
      <ellipse cx="80" cy="92" rx="58" ry="42" fill="#0a0006"/>
      <!-- ojos y nariz -->
      <ellipse cx="52" cy="94" rx="5" ry="7" fill="#e0338f" stroke="none"/>
      <ellipse cx="108" cy="94" rx="5" ry="7" fill="#e0338f" stroke="none"/>
      <ellipse cx="80" cy="104" rx="7" ry="5" fill="#ff8cc6" stroke="none"/>
      <!-- bigotes -->
      <path d="M12 86l22 4M10 100l24-2M16 114l20-8M148 86l-22 4M150 100l-24-2M144 114l-20-8"/>
      <!-- moño -->
      <g transform="translate(106 38) rotate(12)" fill="#e0338f" stroke="#ff8cc6" stroke-width="2.5"><path d="M0 0C-8-16-26-14-26-4s14 14 26 4zM0 0C8-16 26-14 26-4S12 14 0 0z"/><circle cx="0" cy="0" r="5" fill="#ff8cc6"/></g>
      <!-- lágrimas / gotitas góticas -->
      <path d="M52 108c-2 8-2 14 0 20M108 108c2 8 2 14 0 20" stroke="#e0338f"/>
      <!-- cruz pequeña -->
      <path d="M80 130v18M73 137h14" stroke="#e0338f"/>
    </svg>
    <img src="acrilico.png" alt="Acrílico" onerror="this.remove()">
  </div>
</section>

<!-- ================= PRECIOS =================
     Cambia solo los números de .price. Para agregar un largo, copia un bloque "row" entero. -->
<section class="card">
  <div class="row">
    <svg class="ic" viewBox="0 0 58 66"><use href="#nail"/></svg>
    <h3>Largo S / M</h3>
    <span class="price">$15.000</span>
  </div>
  <div class="sep"><svg viewBox="0 0 24 24"><use href="#spark"/></svg></div>
  <div class="row">
    <svg class="ic" viewBox="0 0 58 66"><use href="#nail"/></svg>
    <h3>Largo L / KL</h3>
    <span class="price">$18.000</span>
  </div>
</section>

<!-- ================= PIE ================= -->
<section class="end">
  <svg class="d f" style="left:50%;top:-18px;margin-left:-9px;width:18px;height:18px" viewBox="0 0 24 24"><use href="#spark"/></svg>
  <div class="ln"><svg class="bw" viewBox="0 0 70 50"><use href="#bow"/></svg></div>
  <a class="btn wa" href="#"><svg viewBox="0 0 24 24"><path d="M3 21l1.6-4.8A9 9 0 1 1 8 19.6z"/><path d="M9 8c0 4 3 7 7 7l1-2-3-1.5-1 1c-1-.5-2-1.500-2.500-2.500l1-1L9.500 7z"/></svg>Agendar por WhatsApp →</a>
</section>

</div>

</body>
</html>
